services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: durian_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

  # Database
  db:
    image: postgres:15-alpine
    container_name: durian_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: durian_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # pgAdmin (PostgreSQL Admin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: durian_pgadmin
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db
    restart: always

  # Radius Server
  radius:
    build: ./radius
    container_name: durian_radius
    volumes:
      - ./radius/raddb/clients.conf:/etc/raddb/clients.conf
      - ./radius/raddb/users:/etc/raddb/mods-config/files/authorize
      - ./radius/raddb/mods-available/sql:/etc/raddb/mods-available/sql
      - ./radius/raddb/sites-available/default:/etc/raddb/sites-available/default
    ports:
      - "1812:1812/udp"
    depends_on:
      - db
    user: root
    command: ["radiusd", "-X"]
    restart: always

  # Elysia Backend
  backend:
    build: ./backend
    container_name: durian_backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RADIUS_SERVER: ${RADIUS_SERVER}
      RADIUS_SECRET: ${RADIUS_SECRET}
    depends_on:
      - db
      - radius
    restart: always
    
  # Next.js Frontend
  frontend:
    build: ./frontend
    container_name: durian_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    restart: always
    
volumes:
  postgres_data:
